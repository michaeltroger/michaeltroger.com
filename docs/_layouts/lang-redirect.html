<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none';"/>
		<meta name="referrer" content="no-referrer">
		<meta name="robots" content="noindex">
		<title>{{ page.title }}</title>
		{% if page.section %}
		<link rel="canonical" href="{{ '/' | append: 'en/' | append: page.section | append: '/' | relative_url | absolute_url }}">
		<noscript><meta http-equiv="refresh" content="0; url={{ '/' | append: 'en/' | append: page.section | append: '/' | relative_url }}"></noscript>
		{% else %}
		<link rel="canonical" href="{{ '/en/' | relative_url | absolute_url }}">
		<noscript><meta http-equiv="refresh" content="0; url={{ '/en/' | relative_url }}"></noscript>
		{% endif %}
		<script src="{{ '/js/lang.js' | relative_url }}" data-lang-redirect="true" data-lang-path="{{ page.section }}"></script>
	</head>
	<body>
		<ul>
			{%- for l in site.data.languages %}
			{% if page.section %}
			<li><a href="{{ '/' | append: l[0] | append: '/' | append: page.section | append: '/' | relative_url }}" hreflang="{{ l[0] }}">{{ l[1] }}</a></li>
			{% else %}
			<li><a href="{{ '/' | append: l[0] | append: '/' | relative_url }}" hreflang="{{ l[0] }}">{{ l[1] }}</a></li>
			{% endif %}
			{%- endfor %}
		</ul>
	</body>
</html>
