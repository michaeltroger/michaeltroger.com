<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; form-action 'none'; base-uri 'none';"/>
		<meta name="referrer" content="no-referrer">
		<meta name="robots" content="noindex">
		<title>{{ page.title }}</title>
		<link rel="canonical" href="{{ page.redirect_to | relative_url | absolute_url }}">
		<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
	</head>
	<body>
		<p><a href="{{ page.redirect_to | relative_url }}">{{ page.title }}</a></p>
	</body>
</html>
